<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>云端文件库</title>
<style>
:root{--bg:#0e1220;--card:#171c2e;--line:#2a3150;--txt:#e8ebf4;--mut:#8b93ab;--acc:#5b8cff;--ok:#3ecf8e;--err:#ff5d6c;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;}
.wrap{max-width:760px;margin:0 auto;padding:16px;}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;background:linear-gradient(135deg,#1a2140,#252c55 60%,#1d2447);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;}
header .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#5b8cff,#8f6bff);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
header h1{font-size:17px;}
header p{color:var(--mut);font-size:12px;margin-top:2px;}
.badge{font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);color:var(--mut);white-space:nowrap;}
.badge.ok{color:var(--ok);border-color:rgba(62,207,142,.4);}
.badge.err{color:var(--err);border-color:rgba(255,93,108,.4);}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.bigbtn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 12px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(160deg,#1a2140,#202852);cursor:pointer;transition:transform .12s,border-color .12s;}
.bigbtn:hover{transform:translateY(-2px);border-color:var(--acc);}
.bigbtn .ic{font-size:30px;}
.bigbtn .t{font-size:15px;font-weight:700;}
.bigbtn .d{font-size:11px;color:var(--mut);}
.status{font-size:13px;min-height:18px;margin-bottom:10px;}
.status.info{color:var(--mut);}
.status.ok{color:var(--ok);}
.status.err{color:var(--err);}
.list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.list-head b{font-size:14px;}
.crumb{display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-bottom:8px;}
.crumb a{color:var(--acc);cursor:pointer;text-decoration:none;}
.crumb .sep{color:#3a4266;margin:0 2px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--mut);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px;}
td{padding:9px 10px;border-bottom:1px solid #1c2340;vertical-align:middle;}
tr:hover td{background:rgba(91,140,255,.05);}
.fname{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--txt);}
.fname:hover{color:var(--acc);}
.empty{padding:26px;text-align:center;color:var(--mut);font-size:13px;}
button{background:#1d2547;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;}
button:hover{border-color:var(--acc);}
button.small{padding:4px 10px;font-size:12px;}
#reader{background:#12172b;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;}
#reader h3{font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
#reader pre{white-space:pre-wrap;word-break:break-all;font-size:12px;max-height:460px;overflow:auto;color:#cdd6f2;font-family:ui-monospace,Consolas,monospace;}
#reader img{max-width:100%;max-height:420px;border-radius:8px;}
.hint{font-size:12px;color:var(--mut);margin-top:6px;}
details summary{cursor:pointer;color:var(--mut);font-size:13px;}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:10px;}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px;}
input[type=text],input[type=password]{width:100%;background:#12172b;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:13px;outline:none;}
input:focus{border-color:var(--acc);}
.hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">☁️</div>
    <div style="flex:1">
      <h1>云端文件库</h1>
      <p>点击上传 → 传到云端；点击读取 → 查看已上传的文件</p>
    </div>
    <span class="badge wait" id="conn">未连接</span>
  </header>

  <div class="card">
    <div class="status" id="status">就绪</div>
    <div class="actions">
      <div class="bigbtn" onclick="pickFiles()">
        <span class="ic">⬆️</span><span class="t">上传文件</span><span class="d">选择文件传到云端</span>
      </div>
      <div class="bigbtn" onclick="loadDir()">
        <span class="ic">📂</span><span class="t">读取文件</span><span class="d">查看云端已上传的文件</span>
      </div>
    </div>
    <input type="file" id="file" multiple class="hidden" onchange="uploadFiles()">
    <div class="hint" id="upHint" style="display:none"></div>
  </div>

  <div class="card" id="listCard" style="display:none">
    <div class="list-head"><b>📂 云端文件</b><button class="small" onclick="loadDir()">刷新</button></div>
    <div class="crumb" id="crumb"></div>
    <div id="list"><div class="empty">加载中...</div></div>
    <div id="reader" class="hidden"></div>
  </div>

  <div class="card">
    <details id="adv">
      <summary>高级设置（已配好，一般不用动）</summary>
      <div class="cfg-grid">
        <div><label>仓库 owner</label><input type="text" id="cfg_owner"></div>
        <div><label>仓库 repo</label><input type="text" id="cfg_repo"></div>
        <div><label>分支 branch</label><input type="text" id="cfg_branch"></div>
        <div><label>Token（密钥）</label><input type="password" id="cfg_token"></div>
        <div style="grid-column:1/-1"><label>目录路径（留空=根目录）</label><input type="text" id="cfg_path" placeholder="如：files/"></div>
      </div>
      <button class="small" style="margin-top:10px" onclick="saveCfg()">保存配置</button>
    </details>
  </div>
</div>

<script>
'use strict';
const _TS=['cmZCcGFEbWxHU0E0RUU3NENEOFA2RlhncUk0UHNiT','VlNM3Q0eXExakY5aWtZMVZ0VXdpTWhWODdHRmpfdG','85V0UwRFhyb1FOMEEyTVpNUkIxMV90YXBfYnVodGln'];
function _tok(){try{return atob(_TS.join('')).split('').reverse().join('');}catch(e){return '';}}
const DFLT={owner:'zqy351',repo:'card-cloud',branch:'main',path:'',token:''};
function cfg(){try{return Object.assign({},DFLT,JSON.parse(localStorage.getItem('cloud_file_cfg')||'null')||{});}catch(e){return Object.assign({},DFLT);}}
function saveCfg(){
  const c={owner:el('cfg_owner').value.trim()||DFLT.owner,repo:el('cfg_repo').value.trim()||DFLT.repo,branch:el('cfg_branch').value.trim()||DFLT.branch,path:el('cfg_path').value.trim(),token:el('cfg_token').value.trim()};
  localStorage.setItem('cloud_file_cfg',JSON.stringify(c));
  st('配置已保存 ✓','ok');
}
function el(id){return document.getElementById(id);}
function st(msg,cls){const s=el('status');s.textContent=msg;s.className='status '+(cls||'info');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtSize(n){if(!n&&n!==0)return '-';if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';if(n<1073741824)return (n/1048576).toFixed(2)+' MB';return (n/1073741824).toFixed(2)+' GB';}
function fmtTime(t){if(!t)return '-';const d=new Date(t),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}

function apiUrl(c,path){
  return 'https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+'/contents/'+encodeURIComponent(path||'')+'?ref='+encodeURIComponent(c.branch);
}
async function ghList(path){
  const c=cfg();if(!c.token)return {ok:false,msg:'请先填 Token'};
  let r;
  try{r=await fetch(apiUrl(c,path),{headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'},cache:'no-store'});}
  catch(e){return {ok:false,msg:'网络错误：'+e.message};}
  if(r.status===404)return {ok:false,msg:'路径不存在'};
  if(!r.ok)return {ok:false,msg:'请求失败('+r.status+')'};
  const j=await r.json();
  if(!Array.isArray(j))return {ok:false,msg:'该路径是文件不是目录'};
  return {ok:true,list:j};
}
async function ghGet(path){
  const c=cfg();if(!c.token)return {ok:false,msg:'请先填 Token'};
  let r;
  try{r=await fetch(apiUrl(c,path),{headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'},cache:'no-store'});}
  catch(e){return {ok:false,msg:'网络错误：'+e.message};}
  if(!r.ok)return {ok:false,status:r.status,msg:'读取失败('+r.status+')'};
  return {ok:true,obj:await r.json()};
}
async function ghPut(path,b64,msg,sha){
  const c=cfg();if(!c.token)return {ok:false,msg:'请先填 Token'};
  const url='https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+'/contents/'+encodeURIComponent(path);
  const body={message:msg,content:b64,branch:c.branch};
  if(sha)body.sha=sha;
  let r;
  try{r=await fetch(url,{method:'PUT',cache:'no-store',headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});}
  catch(e){return {ok:false,msg:'网络错误：'+e.message};}
  if(r.ok)return {ok:true};
  return {ok:false,status:r.status,msg:'上传失败('+r.status+')：'+(await r.text()).slice(0,120)};
}

let CUR='';
function normPath(p){return (p||'').replace(/^\/+/,'').replace(/\/+$/,'');}
async function loadDir(){
  const base=normPath(cfg().path);
  const p=normPath(CUR||base);
  CUR=p;
  if(!cfg().token){st('请先填 Token','err');return;}
  st('读取中...','info');
  el('listCard').style.display='';
  const g=await ghList(p);
  if(!g.ok){st(g.msg,'err');el('list').innerHTML='<div class="empty">'+esc(g.msg)+'</div>';return;}
  renderList(g.list,p,base);
  el('conn').textContent='✓ '+cfg().owner+'/'+cfg().repo;
  el('conn').className='badge ok';
  st('读取成功：共 '+g.list.length+' 项 ✓','ok');
}
function renderList(list,path,base){
  const rel=path.replace(new RegExp('^'+base.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'/?'),'');
  const parts=rel?rel.split('/'):[];
  let acc=base;
  let crumbs='<a onclick="goDir(\''+base.replace(/'/g,"\\'")+'\')">根目录</a>';
  parts.forEach(function(part){
    acc=acc?acc+'/'+part:part;
    crumbs+='<span class="sep">/</span><a onclick="goDir(\''+acc.replace(/'/g,"\\'")+'\')">'+esc(part)+'</a>';
  });
  el('crumb').innerHTML=crumbs;
  const dirs=list.filter(x=>x.type==='dir').sort((a,b)=>a.name.localeCompare(b.name));
  const files=list.filter(x=>x.type!=='dir').sort((a,b)=>a.name.localeCompare(b.name));
  const rows=dirs.map(function(d){
    const fp=path?path+'/':'';
    return '<tr><td><span class="fname" onclick="goDir(\''+(fp+d.name).replace(/'/g,"\\'")+'\')"><span>📁</span>'+esc(d.name)+'</span></td><td>目录</td><td>-</td><td></td></tr>';
  }).concat(files.map(function(f){
    const fp=path?path+'/':'';
    const fpjs=(fp+f.name).replace(/'/g,"\\'");
    return '<tr><td><span class="fname" onclick="readFile(\''+fpjs+'\')"><span>📄</span>'+esc(f.name)+'</span></td><td>文件</td><td>'+fmtSize(f.size)+'</td><td><button class="small" onclick="downloadFile(\''+fpjs+'\',\''+f.name.replace(/'/g,"\\'")+'\')">下载</button></td></tr>';
  })).join('');
  el('list').innerHTML=list.length?('<table><thead><tr><th>名称</th><th>类型</th><th>大小</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table>'):'<div class="empty">还没有文件，点「上传文件」添加</div>';
  el('reader').classList.add('hidden');
}
function goDir(p){CUR=p;loadDir();}

async function readFile(path){
  st('读取中...','info');
  el('reader').classList.add('hidden');
  const g=await ghGet(path);
  if(!g.ok){st(g.msg,'err');return;}
  const o=g.obj;
  const name=o.name||path.split('/').pop();
  const isImg=/\.(png|jpe?g|gif|webp|svg|ico|bmp)$/i.test(name);
  let html='<h3>📄 '+esc(name)+' <span class="hint">('+fmtSize(o.size)+')</span> <button class="small" onclick="downloadFile(\''+path.replace(/'/g,"\\'")+'\',\''+name.replace(/'/g,"\\'")+'\')">下载</button> <button class="small" onclick="hideReader()">关闭</button></h3>';
  if(o.content){
    try{
      const bin=atob(o.content);
      if(isImg)html+='<img src="data:image/*;base64,'+o.content+'" alt="'+esc(name)+'">';
      else html+='<pre>'+esc(decodeURIComponent(escape(bin)))+'</pre>';
    }catch(e){html+='<div class="hint">内容解码失败，请下载查看。</div>';}
  }else{
    html+='<div class="hint">文件较大（>1MB），请直接下载查看。</div>';
  }
  el('reader').innerHTML=html;
  el('reader').classList.remove('hidden');
  st('已读取：'+name,'ok');
}
function hideReader(){el('reader').classList.add('hidden');}
async function downloadFile(path,name){
  const c=cfg();
  const url='https://raw.githubusercontent.com/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+'/'+encodeURIComponent(c.branch)+'/'+path.split('/').map(encodeURIComponent).join('/');
  st('下载中：'+name+'...','info');
  try{
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const b=await r.blob();
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name||'file';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    st('已开始下载：'+name+' ✓','ok');
  }catch(e){st('下载失败：'+e.message,'err');}
}

function pickFiles(){el('file').value='';el('file').click();}
async function uploadFiles(){
  const files=el('file').files;
  if(!files||!files.length)return;
  const c=cfg();
  if(!c.token){st('请先填 Token','err');return;}
  const base=normPath(CUR||c.path);
  let done=0,fail=0;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    const fp=base?(base+'/'+f.name):f.name;
    st('上传中 ('+(i+1)+'/'+files.length+')：'+f.name+'...','info');
    if(f.size>50*1024*1024){st('跳过：'+f.name+' 超过 50MB','err');fail++;continue;}
    let sha=null;
    const ex=await ghGet(fp);
    if(ex.ok&&ex.obj.sha)sha=ex.obj.sha;
    if(sha&&!confirm('「'+f.name+'」已存在，覆盖？')){
      if(files.length===1){st('已取消','info');return;}
      continue;
    }
    const b64=await fileToB64(f);
    const r=await ghPut(fp,b64,'upload '+f.name,sha);
    if(r.ok)done++;else{fail++;st(r.msg,'err');}
  }
  if(done){st('上传成功 '+done+' 个'+(fail?'，失败 '+fail:'')+' ✓','ok');setTimeout(loadDir,600);}
}
function fileToB64(file){
  return new Promise(function(res,rej){
    const fr=new FileReader();
    fr.onload=function(){const s=fr.result;const idx=s.indexOf(',');res(idx>=0?s.slice(idx+1):s);};
    fr.onerror=function(){rej(new Error('读取文件失败'));};
    fr.readAsDataURL(file);
  });
}

(function(){
  const c=cfg();
  el('cfg_owner').value=c.owner;el('cfg_repo').value=c.repo;el('cfg_branch').value=c.branch;el('cfg_path').value=c.path;el('cfg_token').value=c.token||'';
  if(!c.token){
    /* 内置云端密钥（已混淆存放）：打开即用。此网页包含仓库写权限，请勿转发给不信任的人 */
    el('cfg_token').value=_tok();saveCfg();
    el('conn').textContent='✓ '+c.owner+'/'+c.repo;el('conn').className='badge ok';
  }else{el('conn').textContent='✓ '+c.owner+'/'+c.repo;el('conn').className='badge ok';}
})();
</script>
</body>
</html>
