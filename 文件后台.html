<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub 文件后台</title>
<style>
:root{--bg:#0e1220;--card:#171c2e;--line:#2a3150;--txt:#e8ebf4;--mut:#8b93ab;--acc:#5b8cff;--ok:#3ecf8e;--err:#ff5d6c;--warn:#ffb454;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;}
.wrap{max-width:1000px;margin:0 auto;padding:16px;}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;background:linear-gradient(135deg,#1a2140,#252c55 60%,#1d2447);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;}
header .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#5b8cff,#8f6bff);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex-shrink:0;}
header h1{font-size:17px;}
header p{color:var(--mut);font-size:12px;margin-top:2px;}
.badge{font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);color:var(--mut);white-space:nowrap;}
.badge.ok{color:var(--ok);border-color:rgba(62,207,142,.4);}
.badge.err{color:var(--err);border-color:rgba(255,93,108,.4);}
.badge.wait{color:var(--warn);border-color:rgba(255,180,84,.4);}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:10px;}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px;}
input[type=text],input[type=password]{width:100%;background:#12172b;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:13px;outline:none;}
input:focus{border-color:var(--acc);}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.pathbox{flex:1;min-width:200px;display:flex;align-items:center;gap:6px;background:#12172b;border:1px solid var(--line);border-radius:8px;padding:0 10px;}
.pathbox span{color:var(--mut);font-size:13px;}
.pathbox input{flex:1;border:none;background:none;padding:9px 0;}
.crumb{display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-size:13px;margin-bottom:10px;color:var(--mut);}
.crumb a{color:var(--acc);cursor:pointer;text-decoration:none;}
.crumb a:hover{text-decoration:underline;}
.crumb .sep{color:#3a4266;margin:0 2px;}
button{background:#1d2547;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;}
button:hover{border-color:var(--acc);}
button.primary{background:linear-gradient(135deg,#4d7dff,#7a5bff);border:none;font-weight:600;}
button.primary:hover{filter:brightness(1.1);}
button.small{padding:4px 10px;font-size:12px;}
button.danger{border-color:rgba(255,93,108,.4);color:var(--err);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--mut);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px;}
td{padding:9px 10px;border-bottom:1px solid #1c2340;vertical-align:middle;}
tr:hover td{background:rgba(91,140,255,.05);}
.fname{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--txt);}
.fname:hover{color:var(--acc);}
.fname .ic{font-size:16px;flex-shrink:0;}
.empty{padding:28px;text-align:center;color:var(--mut);font-size:13px;}
.status{font-size:13px;min-height:18px;margin-bottom:8px;}
.status.info{color:var(--mut);}
.status.ok{color:var(--ok);}
.status.err{color:var(--err);}
#reader{background:#12172b;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;}
#reader h3{font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
#reader pre{white-space:pre-wrap;word-break:break-all;font-size:12px;max-height:480px;overflow:auto;color:#cdd6f2;font-family:ui-monospace,Consolas,monospace;}
#reader img{max-width:100%;max-height:420px;border-radius:8px;}
.hint{font-size:12px;color:var(--mut);margin-top:6px;}
details summary{cursor:pointer;color:var(--mut);font-size:13px;}
details[open] summary{margin-bottom:6px;}
.hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">📁</div>
    <div style="flex:1">
      <h1>GitHub 文件后台</h1>
      <p>向仓库上传文件 / 读取仓库文件</p>
    </div>
    <span class="badge wait" id="conn">未连接</span>
  </header>

  <div class="card">
    <details id="adv">
      <summary>高级设置（已配置好，一般不用动）</summary>
      <div class="cfg-grid">
        <div><label>仓库拥有者 owner</label><input type="text" id="cfg_owner"></div>
        <div><label>仓库名 repo</label><input type="text" id="cfg_repo"></div>
        <div><label>分支 branch</label><input type="text" id="cfg_branch"></div>
        <div><label>Token（GitHub 密钥）</label><input type="password" id="cfg_token" placeholder="github_pat_..."></div>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="small" onclick="saveCfg()">保存配置</button>
        <span class="hint">Token 只保存在本机浏览器，用于 GitHub 文件读写。</span>
      </div>
    </details>
  </div>

  <div class="card">
    <div class="status" id="status">就绪</div>
    <div class="toolbar">
      <div class="pathbox"><span>📂</span><input type="text" id="path" value="" placeholder="目录路径（留空=根目录）" onkeydown="if(event.key==='Enter')loadDir()"></div>
      <button onclick="loadDir()">刷新</button>
      <button class="primary" onclick="pickFiles()">⬆ 上传文件</button>
      <input type="file" id="file" multiple class="hidden" onchange="uploadFiles()">
    </div>
    <div class="crumb" id="crumb"></div>
    <div id="list"><div class="empty">点击「刷新」查看仓库文件</div></div>
    <div id="reader" class="hidden"></div>
  </div>
</div>

<script>
'use strict';
/* ================= 配置 ================= */
const DFLT={owner:'zqy351',repo:'card-cloud',branch:'main',path:'',token:''};
function cfg(){try{return Object.assign({},DFLT,JSON.parse(localStorage.getItem('file_admin_cfg')||'null')||{});}catch(e){return Object.assign({},DFLT);}}
function saveCfg(){
  const c={owner:el('cfg_owner').value.trim()||DFLT.owner,repo:el('cfg_repo').value.trim()||DFLT.repo,branch:el('cfg_branch').value.trim()||DFLT.branch,path:el('path').value||'',token:el('cfg_token').value.trim()};
  localStorage.setItem('file_admin_cfg',JSON.stringify(c));
  st('配置已保存 ✓','ok');
}
function el(id){return document.getElementById(id);}
function st(msg,cls){const s=el('status');s.textContent=msg;s.className='status '+(cls||'info');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtSize(n){if(!n&&n!==0)return '-';if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';if(n<1073741824)return (n/1048576).toFixed(2)+' MB';return (n/1073741824).toFixed(2)+' GB';}
function fmtTime(t){if(!t)return '-';const d=new Date(t),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}

/* ================= GitHub API ================= */
function apiBase(c,path){
  const p=encodeURIComponent(path||'');
  return 'https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+'/contents/'+p+'?ref='+encodeURIComponent(c.branch);
}
async function ghList(path){
  const c=cfg();if(!c.token)return {ok:false,msg:'请先填写 Token'};
  const url=apiBase(c,path);
  let r;
  try{r=await fetch(url,{headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'},cache:'no-store'});}
  catch(e){return {ok:false,msg:'网络错误：'+e.message};}
  if(r.status===404)return {ok:false,msg:'路径不存在或无权访问'};
  if(!r.ok)return {ok:false,msg:'请求失败('+r.status+')：'+(await r.text()).slice(0,160)};
  const j=await r.json();
  if(!Array.isArray(j))return {ok:false,msg:'该路径是一个文件，不是目录'};
  return {ok:true,list:j};
}
async function ghGet(path){
  const c=cfg();if(!c.token)return {ok:false,msg:'请先填写 Token'};
  const url=apiBase(c,path);
  let r;
  try{r=await fetch(url,{headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'},cache:'no-store'});}
  catch(e){return {ok:false,msg:'网络错误：'+e.message};}
  if(!r.ok)return {ok:false,status:r.status,msg:'读取失败('+r.status+')'};
  return {ok:true,obj:await r.json()};
}
async function ghPut(path,b64,msg,sha){
  const c=cfg();if(!c.token)return {ok:false,msg:'请先填写 Token'};
  const url='https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+'/contents/'+encodeURIComponent(path);
  const body={message:msg,content:b64,branch:c.branch};
  if(sha)body.sha=sha;
  let r;
  try{r=await fetch(url,{method:'PUT',cache:'no-store',headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});}
  catch(e){return {ok:false,msg:'网络错误：'+e.message};}
  if(r.ok)return {ok:true};
  return {ok:false,status:r.status,msg:'上传失败('+r.status+')：'+(await r.text()).slice(0,160)};
}

/* ================= 列表与导航 ================= */
let CUR='';
function normPath(p){p=(p||'').replace(/^\/+/,'').replace(/\/+$/,'');return p;}
async function loadDir(){
  const p=normPath(el('path').value||CUR);
  CUR=p;el('path').value=p;
  st('加载中...','info');
  const g=await ghList(p);
  if(!g.ok){st(g.msg,'err');el('list').innerHTML='<div class="empty">'+esc(g.msg)+'</div>';el('crumb').innerHTML='';return;}
  renderList(g.list,p);
  const c=cfg();
  el('conn').textContent='✓ '+c.owner+'/'+c.repo+' · '+c.branch;
  el('conn').className='badge ok';
  st('共 '+g.list.length+' 项 ✓','ok');
}
function renderList(list,path){
  const parts=path?path.split('/'):[];
  let acc='';
  el('crumb').innerHTML='<a onclick="goDir(\'\')">根目录</a>'+parts.map(function(part,i){
    acc=acc?acc+'/'+part:part;
    return '<span class="sep">/</span><a onclick="goDir(\''+acc.replace(/'/g,"\\'")+'\')">'+esc(part)+'</a>';
  }).join('');
  const dirs=list.filter(x=>x.type==='dir').sort((a,b)=>a.name.localeCompare(b.name));
  const files=list.filter(x=>x.type!=='dir').sort((a,b)=>a.name.localeCompare(b.name));
  const rows=dirs.map(function(d){
    return '<tr><td><span class="fname" onclick="goDir(\''+(path?path+'/':'')+d.name.replace(/'/g,"\\'")+'\')"><span class="ic">📁</span>'+esc(d.name)+'</span></td><td>目录</td><td>-</td><td>'+esc(fmtTime(d.updated_at?d.updated_at.replace('T',' ').replace('Z',''):''))+'</td><td></td></tr>';
  }).concat(files.map(function(f){
    const fp=path?path+'/':''+f.name;
    const fpjs=fp.replace(/'/g,"\\'");
    return '<tr><td><span class="fname" onclick="readFile(\''+fpjs+'\')"><span class="ic">📄</span>'+esc(f.name)+'</span></td><td>文件</td><td>'+fmtSize(f.size)+'</td><td>'+esc(fmtTime(f.updated_at?f.updated_at.replace('T',' ').replace('Z',''):''))+'</td><td class="row"><button class="small" onclick="downloadFile(\''+fpjs+'\',\''+f.name.replace(/'/g,"\\'")+'\')">下载</button></td></tr>';
  })).join('');
  el('list').innerHTML=list.length?('<table><thead><tr><th>名称</th><th>类型</th><th>大小</th><th>更新时间</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table>'):'<div class="empty">空目录，点「上传文件」添加</div>';
  el('reader').classList.add('hidden');
}
function goDir(p){el('path').value=p;loadDir();}

/* ================= 读取 ================= */
async function readFile(path){
  st('读取中...','info');
  el('reader').classList.add('hidden');
  const g=await ghGet(path);
  if(!g.ok){st(g.msg,'err');return;}
  const o=g.obj;
  const name=o.name||path.split('/').pop();
  const isImg=/\.(png|jpe?g|gif|webp|svg|ico|bmp)$/i.test(name);
  const isTxt=/\.(txt|md|json|html?|js|css|py|c|cpp|java|go|rs|sh|bat|ini|yml|yaml|xml|csv|log|conf|gitignore)$/i.test(name)||!o.content;
  let html='<h3>📄 '+esc(name)+' <span class="hint">('+fmtSize(o.size)+')</span> <button class="small" onclick="downloadFile(\''+path.replace(/'/g,"\\'")+'\',\''+name.replace(/'/g,"\\'")+'\')">下载</button> <button class="small" onclick="hideReader()">关闭</button></h3>';
  if(o.content){
    try{
      const bin=atob(o.content);
      if(isImg&&!isTxt){
        html+='<img src="data:'+(o.encoding==='base64'?'image/*':'application/octet-stream')+';base64,'+o.content+'" alt="'+esc(name)+'">';
      }else{
        html+='<pre>'+esc(decodeURIComponent(escape(bin)))+'</pre>';
      }
    }catch(e){html+='<div class="hint">内容解码失败，请下载查看。</div>';}
  }else{
    html+='<div class="hint">文件较大（>1MB），GitHub 不返回内容，请直接下载查看。</div>';
  }
  el('reader').innerHTML=html;
  el('reader').classList.remove('hidden');
  st('已读取：'+name,'ok');
}
function hideReader(){el('reader').classList.add('hidden');}
async function downloadFile(path,name){
  const c=cfg();
  const url='https://raw.githubusercontent.com/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+'/'+encodeURIComponent(c.branch)+'/'+path.split('/').map(encodeURIComponent).join('/');
  st('下载中：'+name+'...','info');
  try{
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const b=await r.blob();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=name||'file';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    st('已开始下载：'+name+' ✓','ok');
  }catch(e){st('下载失败：'+e.message,'err');}
}

/* ================= 上传 ================= */
function pickFiles(){el('file').value='';el('file').click();}
async function uploadFiles(){
  const files=el('file').files;
  if(!files||!files.length)return;
  const base=(CUR?CUR+'/':'');
  let done=0,fail=0;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    const fp=base+f.name;
    st('上传中 ('+(i+1)+'/'+files.length+')：'+f.name+'...','info');
    if(f.size>50*1024*1024){st('跳过：'+f.name+' 超过 50MB（GitHub 单文件上限 100MB）','err');fail++;continue;}
    let sha=null;
    const ex=await ghGet(fp);
    if(ex.ok&&ex.obj&&ex.obj.sha){sha=ex.obj.sha;}
    else if(!ex.ok&&ex.status!==404){st('检查同名失败：'+ex.msg,'err');fail++;continue;}
    if(sha&&!confirm('文件「'+f.name+'」已存在，是否覆盖？')){
      if(files.length===1){st('已取消上传','info');return;}
      continue;
    }
    const b64=await fileToB64(f);
    const r=await ghPut(fp,b64,'upload '+f.name+' @'+new Date().toISOString(),sha);
    if(r.ok)done++;else{fail++;st(r.msg,'err');}
  }
  if(done)st('上传完成：成功 '+done+' 个'+(fail?'，失败 '+fail+' 个':'')+' ✓','ok');
  loadDir();
}
function fileToB64(file){
  return new Promise(function(res,rej){
    const fr=new FileReader();
    fr.onload=function(){const s=fr.result;const idx=s.indexOf(',');res(idx>=0?s.slice(idx+1):s);};
    fr.onerror=function(){rej(new Error('读取文件失败'));};
    fr.readAsDataURL(file);
  });
}

/* ================= 初始化 ================= */
(function(){
  const c=cfg();
  el('cfg_owner').value=c.owner;el('cfg_repo').value=c.repo;el('cfg_branch').value=c.branch;el('cfg_token').value=c.token||'';
  if(!c.token){el('conn').textContent='⚠ 未填 Token';el('conn').className='badge err';}
  else{loadDir();}
})();
</script>
</body>
</html>
